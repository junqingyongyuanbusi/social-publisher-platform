name: social-publisher
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_publisher
      POSTGRES_USER: social
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U social -d social_publisher]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    entrypoint:
      - /bin/sh
      - -c
      - 'exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$(cat $$REDIS_PASSWORD_FILE)"'
    secrets: [redis_password]
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  migrate:
    image: social-publisher-api:${IMAGE_TAG:-latest}
    build: { context: .., target: api }
    command:
      [
        '/bin/sh',
        '-c',
        'export DATABASE_URL="postgresql://social:$$(cat /run/secrets/postgres_password)@postgres:5432/social_publisher"; exec pnpm --filter @social/database prisma:deploy',
      ]
    env_file: [.env.production]
    secrets: [postgres_password]
    depends_on: { postgres: { condition: service_healthy } }
    restart: no
    networks: [backend]

  api:
    image: social-publisher-api:${IMAGE_TAG:-latest}
    build: { context: .., target: api }
    restart: unless-stopped
    env_file: [.env.production]
    command:
      [
        '/bin/sh',
        '-c',
        'export DATABASE_URL="postgresql://social:$$(cat /run/secrets/postgres_password)@postgres:5432/social_publisher"; export REDIS_URL="redis://:$$(cat /run/secrets/redis_password)@redis:6379"; exec node --import ./apps/api/dist/instrumentation.js apps/api/dist/main.js',
      ]
    environment:
      OTEL_SERVICE_NAME: social-publisher-api
    secrets: [postgres_password, redis_password]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  worker:
    image: social-publisher-worker:${IMAGE_TAG:-latest}
    build: { context: .., target: worker }
    restart: unless-stopped
    env_file: [.env.production]
    command:
      [
        '/bin/sh',
        '-c',
        'export DATABASE_URL="postgresql://social:$$(cat /run/secrets/postgres_password)@postgres:5432/social_publisher"; export REDIS_URL="redis://:$$(cat /run/secrets/redis_password)@redis:6379"; exec node --import ./apps/worker/dist/instrumentation.js apps/worker/dist/main.js',
      ]
    environment:
      OTEL_SERVICE_NAME: social-publisher-worker
    secrets: [postgres_password, redis_password]
    depends_on:
      api: { condition: service_healthy }
    networks: [backend, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  web:
    image: social-publisher-web:${IMAGE_TAG:-latest}
    build: { context: .., target: web }
    restart: unless-stopped
    env_file: [.env.production]
    command:
      [
        '/bin/sh',
        '-c',
        'export REDIS_URL="redis://:$$(cat /run/secrets/redis_password)@redis:6379"; exec node apps/web/server.js',
      ]
    secrets: [redis_password]
    depends_on: { api: { condition: service_healthy } }
    ports: [127.0.0.1:3000:3000]
    networks: [edge, backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    restart: unless-stopped
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [./otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      [
        --config.file=/etc/prometheus/prometheus.yml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=30d,
      ]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: [127.0.0.1:9090:9090]
    networks: [backend]

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  redis_password: { file: ./secrets/redis_password }
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
networks:
  edge:
  egress:
  backend: { internal: true }
